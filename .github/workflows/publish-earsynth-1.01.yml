name: Publish earsynth 1.01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-earsynth-1.01.yml

permissions:
  contents: write

concurrency:
  group: earsynth-publish-1.01
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify the approved installers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          specification = json.loads(pathlib.Path('release-inputs.json').read_text())
          assert (specification['product'], specification['version'], specification['vendor']) == ('earsynth', '1.01', 'Alex Ears')
          artifact = specification['artifact']
          with urllib.request.urlopen(artifact['url'], timeout=90) as response:
              archive_bytes = response.read()
          assert len(archive_bytes) == artifact['size_bytes']
          assert hashlib.sha256(archive_bytes).hexdigest() == artifact['sha256'], 'Artifact checksum mismatch'
          complete = specification['bundle']
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              assert archive.namelist() == [complete['name']], 'Unexpected artifact contents'
              bundle_bytes = archive.read(complete['name'])
          assert len(bundle_bytes) == complete['size_bytes']
          assert hashlib.sha256(bundle_bytes).hexdigest() == complete['sha256'], 'Complete bundle checksum mismatch'
          out = pathlib.Path('dist')
          out.mkdir()
          (out / complete['name']).write_bytes(bundle_bytes)
          with zipfile.ZipFile(io.BytesIO(bundle_bytes)) as bundle:
              approved = {'earsynth_1.01_Release/' + a['relative_path'] for a in specification['assets']}
              approved |= {'earsynth_1.01_Release/README_RU.txt', 'earsynth_1.01_Release/SHA256SUMS.txt'}
              assert set(bundle.namelist()) == approved and len(bundle.namelist()) == 7
              assert bundle.testzip() is None
              for selected in specification['assets']:
                  name = selected['name']
                  assert pathlib.PurePosixPath(name).name == name and name.startswith('Alex_Ears_earsynth_1.01_')
                  payload = bundle.read('earsynth_1.01_Release/' + selected['relative_path'])
                  assert len(payload) == selected['size_bytes'], name
                  assert hashlib.sha256(payload).hexdigest() == selected['sha256'], name
                  (out / name).write_bytes(payload)
          assert len(list(out.iterdir())) == 6, 'Expected five platform downloads and one complete release bundle'
          checks = ''.join(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n' for path in sorted(out.iterdir()))
          assert hashlib.sha256(checks.encode()).hexdigest() == '864050ab1cebd23a7ab307489369329dde708669b4e7fc69b20362bf4b61b53d', 'Checksum manifest mismatch'
          (out / 'SHA256SUMS.txt').write_text(checks)
          print(checks)
          PY
      - name: Create and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.01 dist/* --repo "$GITHUB_REPOSITORY" --title 'earsynth 1.01' --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --draft
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > github-releases.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          reports = json.loads(pathlib.Path('github-releases.json').read_text())
          matching = [r for r in reports if r['tag_name'] == 'v1.01']
          assert len(matching) == 1
          report = matching[0]
          assert report['draft'] and not report['prerelease']
          expected = {p.name: (p.stat().st_size, 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest()) for p in pathlib.Path('dist').iterdir()}
          actual = {a['name']: (a['size'], a['digest']) for a in report['assets']}
          assert len(expected) == 7 and actual == expected, (actual, expected)
          assert all(a['state'] == 'uploaded' for a in report['assets'])
          print('All seven release assets verified by size and SHA256.')
          PY
          gh release edit v1.01 --repo "$GITHUB_REPOSITORY" --draft=false --latest
